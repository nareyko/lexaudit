version: 1
rules:
  # Editorial calque & false-friend needles (2026-10-29)
  - pattern: "orientir"
    locale: en
    reason: "loan-calque-orientir"
    hint: "working rule / ballpark / figures - not orientir"
    severity: confirmed
    source: "editorial-calque-bank"
  - pattern: "orientirs"
    locale: en
    reason: "loan-calque-orientir"
    hint: "working figures / examples"
    severity: confirmed
    source: "editorial-calque-bank"
  - pattern: "*-orientir"
    locale: en
    match: glob
    reason: "loan-calque-orientir"
    hint: "compound with orientir - rewrite"
    severity: confirmed
    source: "editorial-calque-bank"
  - pattern: "*-orientirs"
    locale: en
    match: glob
    reason: "loan-calque-orientir"
    hint: "compound with orientirs - rewrite"
    severity: confirmed
    source: "editorial-calque-bank"
