[project]
name = "lexaudit"
version = "0.3.0"
description = "Locale vocabulary audit: inventeds, calques, foreign slips; page ranking for rewrite agents"
readme = "README.md"
license = "MIT"
keywords = ["spellcheck", "calque", "false-friends", "proofreading", "localization", "i18n", "seo", "markdown", "nlp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Natural Language :: German",
  "Natural Language :: Spanish",
  "Natural Language :: Polish",
  "Natural Language :: Russian",
  "Natural Language :: Swedish",
  "Natural Language :: Ukrainian",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
authors = [{ name = "Vadim Nareyko" }]
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "regex>=2024.11",
  "httpx>=0.27",
  "pymorphy3>=2.0",
  "pymorphy3-dicts-ru>=2.4",
  "pymorphy3-dicts-uk>=2.4",
  "click>=8.1",
  "spylls>=0.1.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.115",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.23",
  "radon>=6.0",
  "mutmut>=2.4,<3",
  "libcst>=1.4",
]
mcp = [
  # 2.x renames FastMCP → MCPServer; keep 1.x until shell migrates.
  "mcp>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/nareyko/lexaudit"
Issues = "https://github.com/nareyko/lexaudit/issues"
Documentation = "https://github.com/nareyko/lexaudit/tree/main/docs"

[project.scripts]
lexaudit = "lexaudit.cli.main:main"
lexaudit-mcp = "lexaudit.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexaudit"]

[tool.hatch.build.targets.wheel.force-include]
"rules/calques" = "lexaudit/rules/calques"
"packs/core-calques-v1" = "lexaudit/packs_data/core-calques-v1"
"packs/saas-ui-v0" = "lexaudit/packs_data/saas-ui-v0"
"packs/fintech-v0" = "lexaudit/packs_data/fintech-v0"
"packs/developer-docs-v0" = "lexaudit/packs_data/developer-docs-v0"
"packs/ecommerce-ui-v0" = "lexaudit/packs_data/ecommerce-ui-v0"
"packs/healthcare-ui-v0" = "lexaudit/packs_data/healthcare-ui-v0"
"packs/legal-docs-v0" = "lexaudit/packs_data/legal-docs-v0"
"packs/gaming-ui-v0" = "lexaudit/packs_data/gaming-ui-v0"
"packs/edtech-v0" = "lexaudit/packs_data/edtech-v0"
"packs/security-docs-v0" = "lexaudit/packs_data/security-docs-v0"
"packs/hr-ats-v0" = "lexaudit/packs_data/hr-ats-v0"

[tool.uv]
package = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/render_diagrams.py" = ["E501", "RUF001"]
"src/lexaudit/mcp_server.py" = ["E501"]
"lab/**" = ["E501", "RUF001"]
# Cyrillic fixtures in bilingual MCP smoke (format collapses to one line).
"tests/test_mcp_smoke.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["lexaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=lexaudit --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["lexaudit"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "hypothesis>=6.115",
    "mutmut>=2.4,<3",
]

[[tool.mypy.overrides]]
module = ["spylls.*", "mcp.*"]
ignore_missing_imports = true
