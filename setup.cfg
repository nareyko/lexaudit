[mutmut]
# Core detectors + classify/rank. pipeline.py / metrics.py excluded: high
# equivalent-mutant noise (wiring + counter increments) vs kill value.
paths_to_mutate=src/lexaudit/core/aggregate.py,src/lexaudit/core/classify.py,src/lexaudit/core/rank.py,src/lexaudit/core/tokenize.py,src/lexaudit/detectors/calque.py,src/lexaudit/detectors/compound.py,src/lexaudit/detectors/crosslocale.py,src/lexaudit/detectors/foreign.py,src/lexaudit/detectors/hunspell.py,src/lexaudit/detectors/template.py,src/lexaudit/dictpacks/loader.py,src/lexaudit/report/diff.py
backup=False
runner=env PYTEST_ADDOPTS= python -m pytest -x -q -o addopts= -p no:cov
tests_dir=tests/
# Type-annotation-only mutants (e.g. DetectorFn = None) are equivalent.
disable_mutation_types=annassign
