name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --extra dev
      - name: Spelling dictionaries (user cache, no apt)
        run: uv run lexaudit fetch-dicts
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy --strict src/
      - name: Pytest (unit, property/fuzz, golden regression, schema, read-only)
        run: uv run pytest
      - name: Pack density gate (7 locales)
        if: matrix.python-version == '3.12'
        run: uv run python scripts/check_pack_density.py
      - name: Bilingual held-out ship bar
        if: matrix.python-version == '3.12'
        run: uv run python scripts/bilingual_metrics.py
      - name: Repo hygiene (no dumps/tmp/vsix tracked)
        if: matrix.python-version == '3.12'
        run: uv run python scripts/check_repo_hygiene.py
      - name: Complexity / CRAP gate
        if: matrix.python-version == '3.12'
        run: uv run python scripts/crap_report.py
      - name: Package build smoke (wheel + sdist)
        run: uv build
      - name: Pre-commit hook metadata
        run: test -f .pre-commit-hooks.yaml && grep -q 'id: lexaudit' .pre-commit-hooks.yaml

  mutation:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --extra dev
      - name: Spelling dictionaries (user cache, no apt)
        run: uv run lexaudit fetch-dicts
      - name: Mutmut
        run: uv run mutmut run
      - name: Gate >=80%
        run: uv run python scripts/check_mutation_score.py --min-percent 80
      - name: Write report artifact
        if: always()
        run: |
          uv run python - <<'PY'
          import sqlite3
          from pathlib import Path
          cache = Path(".mutmut-cache")
          lines = ["# Mutation testing report", ""]
          if cache.is_file():
              rows = dict(sqlite3.connect(cache).execute(
                  "select status, count(*) from Mutant group by status"
              ).fetchall())
              killed = rows.get("ok_killed", 0)
              survived = rows.get("bad_survived", 0)
              total = killed + survived
              rate = (killed / total * 100) if total else 0
              lines += [
                  f"Total mutants: **{total}**",
                  f"- killed: {killed}",
                  f"- survived: {survived}",
                  "",
                  f"**Mutation score: {rate:.1f}%**",
                  "",
              ]
          else:
              lines.append("No .mutmut-cache produced.")
          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/mutation-report.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexaudit-mutation-report
          path: artifacts/mutation-report.md

  soft-audit-artifact:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --extra dev
      - name: Spelling dictionaries (user cache, no apt)
        run: uv run lexaudit fetch-dicts --locale en
      - name: Environment doctor
        run: uv run lexaudit doctor --config examples/lexaudit.config.example.yaml
      - name: Self-audit documentation
        run: uv run lexaudit audit --config examples/lexaudit.config.example.yaml --locale en
      - name: Soft audit + diff vs baseline (never fail on drift)
        run: bash scripts/ci_soft_audit.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexaudit-soft-audit
          path: |
            artifacts/soft-audit-summary.md
            artifacts/diff.json

  dogfood-action:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install local package for Action dogfood
        run: uv pip install --system .
      - name: Audit synthetic demo (expect findings; allow failure)
        continue-on-error: true
        run: |
          uv run lexaudit audit \
            --config examples/synthetic-demo/lexaudit.config.yaml \
            --locale en \
            --check \
            --format sarif \
            --sarif-file lexaudit-results.sarif \
            --github-annotations
      - name: SARIF file produced
        run: test -f lexaudit-results.sarif
