version: 1
rules:
  - pattern: "чарджбек"
    locale: ru
    reason: "fintech-ru-chargeback-loan"
    hint: "оспаривание платежа / возвратный платёж"
    severity: weak
    source: "lab-fintech"
  - pattern: "рефанд"
    locale: ru
    reason: "fintech-ru-refund-loan"
    hint: "возврат средств"
    severity: likely
    source: "lab-fintech"
  - pattern: "пейаут"
    locale: ru
    reason: "fintech-ru-payout-loan"
    hint: "выплата"
    severity: likely
    source: "lab-fintech"
  - pattern: "сеттлмент"
    locale: ru
    reason: "fintech-ru-settlement-loan"
    hint: "расчёты / клиринг"
    severity: likely
    source: "lab-fintech"
  - pattern: "вайер"
    locale: ru
    reason: "fintech-ru-wire-loan"
    hint: "банковский перевод"
    severity: likely
    source: "lab-fintech"
  - pattern: "чекинг"
    locale: ru
    reason: "fintech-ru-checking-loan"
    hint: "текущий счёт"
    severity: likely
    source: "lab-fintech"
  - pattern: "холд"
    locale: ru
    reason: "fintech-ru-hold-loan"
    hint: "блокировка / удержание суммы"
    severity: weak
    source: "lab-fintech"
  - pattern: "chargebackness"
    locale: ru
    reason: "fintech-en-chargebackness-in-ru"
    hint: "риск оспаривания платежа"
    severity: confirmed
    source: "lab-fintech"
  - pattern: "settleness"
    locale: ru
    reason: "fintech-en-settleness-in-ru"
    hint: "статус расчётов"
    severity: confirmed
    source: "lab-fintech"
  - pattern: "payoutness"
    locale: ru
    reason: "fintech-en-payoutness-in-ru"
    hint: "статус выплаты"
    severity: confirmed
    source: "lab-fintech"
  - pattern: "ibanize"
    locale: ru
    reason: "fintech-en-ibanize-in-ru"
    hint: "проверить IBAN"
    severity: confirmed
    source: "lab-fintech"
  - pattern: "sepaize"
    locale: ru
    reason: "fintech-en-sepaize-in-ru"
    hint: "отправить через SEPA"
    severity: confirmed
    source: "lab-fintech"
  - pattern: "kycess"
    locale: ru
    reason: "fintech-en-kycess-in-ru"
    hint: "статус KYC"
    severity: confirmed
    source: "lab-fintech"
  - pattern: "walletness"
    locale: ru
    reason: "fintech-en-walletness-in-ru"
    hint: "состояние кошелька"
    severity: confirmed
    source: "lab-fintech"
  - pattern: "cardness"
    locale: ru
    reason: "fintech-en-cardness-in-ru"
    hint: "статус карты"
    severity: confirmed
    source: "lab-fintech"
  - pattern: "fxness"
    locale: ru
    reason: "fintech-en-fxness-in-ru"
    hint: "курс валют"
    severity: confirmed
    source: "lab-fintech"
  - pattern: "ledgerness"
    locale: ru
    reason: "fintech-en-ledgerness-in-ru"
    hint: "состояние книги учёта"
    severity: confirmed
    source: "lab-fintech"
  - pattern: "payability"
    locale: ru
    reason: "fintech-en-payability-in-ru"
    hint: "возможность оплаты"
    severity: likely
    source: "lab-fintech"
  - pattern: "refundability"
    locale: ru
    reason: "fintech-en-refundability-in-ru"
    hint: "возможность возврата"
    severity: likely
    source: "lab-fintech"
  - pattern: "wireability"
    locale: ru
    reason: "fintech-en-wireability-in-ru"
    hint: "возможность перевода"
    severity: likely
    source: "lab-fintech"

  - pattern: "пейаут"
    locale: ru
    reason: "fintech-payout-loan"
    hint: "выплата"
    severity: likely
    source: "lab-fintech"
  - pattern: "чарджбек"
    locale: ru
    reason: "fintech-chargeback-loan"
    hint: "оспаривание платежа / возврат по претензии"
    severity: likely
    source: "lab-fintech"
  - pattern: "рефанд"
    locale: ru
    reason: "fintech-refund-loan"
    hint: "возврат средств"
    severity: likely
    source: "lab-fintech"
  - pattern: "леджер"
    locale: ru
    reason: "fintech-ledger-loan"
    hint: "книга учёта / регистр"
    severity: weak
    source: "lab-fintech"
  - pattern: "сеттлмент"
    locale: ru
    reason: "fintech-settlement-loan"
    hint: "расчёты / урегулирование"
    severity: likely
    source: "lab-fintech"
