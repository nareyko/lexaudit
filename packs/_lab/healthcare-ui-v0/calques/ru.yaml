    locale: ru
    reason: "health-appointment-loan"
    hint: "запись / приём"
    severity: likely
    source: "lab-healthcare"
  - pattern: "рефилл"
    locale: ru
    reason: "health-refill-loan"
    hint: "повторный рецепт / повторный отпуск"
    severity: likely
    source: "lab-healthcare"
  - pattern: "триаж"
    locale: ru
    reason: "health-triage-loan"
    hint: "сортировка пациентов (допустимо в клинике с пояснением)"
    severity: weak
    source: "lab-healthcare"
    override_ok: true
  - pattern: "симптомайз"
    locale: ru
    reason: "health-symptomize-calque"
    hint: "описать симптомы"
    severity: confirmed
    source: "lab-healthcare"
