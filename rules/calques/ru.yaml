version: 1
rules:
  - pattern: "diy-осмотр"
    locale: ru
    reason: "calque-diy-survey"
    hint: "смешение DIY + осмотр; лучше «самостоятельный осмотр» или «осмотр своими силами»"
    severity: likely
    source: "editorial-calque-bank"
  # Editorial calque & false-friend needles (2026-10-29)
  # Note: «скеге» in «на скеге» is prepositional case of скег - NOT a calque; do not rule-match.
  - pattern: "предпокупочн*"
    locale: ru
    match: glob
    reason: "loan-calque-prepurchase"
    hint: "осмотр перед покупкой / сюрвей перед покупкой"
    severity: confirmed
    source: "editorial-calque-bank"
  - pattern: "чеклист*"
    locale: ru
    match: glob
    reason: "loan-calque-checklist"
    hint: "контрольный список / список"
    severity: likely
    source: "editorial-calque-bank"
  - pattern: "блувотер*"
    locale: ru
    match: glob
    reason: "loan-calque-bluewater"
    hint: "океанский переход / океанские переходы"
    severity: confirmed
    source: "editorial-calque-bank"
  - pattern: "denseness"
    locale: ru
    reason: "template-calque-denseness"
    hint: "цифры / материалы / чтение SERP - не denseness"
    severity: confirmed
    source: "editorial-calque-bank"
    override_ok: true
  - pattern: "чеклист"
    locale: ru
    reason: "loan-calque-checklist"
    hint: "часто лучше «контрольный список» / «чек-лист» с дефисом по редакционной норме"
    severity: likely
    source: "editorial-loan-watch"
  - pattern: "фидбек"
    locale: ru
    reason: "loan-calque-feedback"
    hint: "отзыв / обратная связь"
    severity: weak
    source: "editorial-loan-watch"
  - pattern: "апгрейд"
    locale: ru
    reason: "loan-calque-upgrade"
    hint: "модернизация / обновление"
    severity: weak
    source: "editorial-loan-watch"
  - pattern: "сетап"
    locale: ru
    reason: "loan-calque-setup"
    hint: "компоновка / оснащение"
    severity: weak
    source: "editorial-loan-watch"
  - pattern: "рефит"
    locale: ru
    reason: "loan-calque-refit"
    hint: "переоборудование (если не осознанный морской термин)"
    severity: weak
    source: "maritime-loan-watch"
  - pattern: "листинге"
    locale: ru
    reason: "loan-calque-listing"
    hint: "в объявлении"
    severity: likely
    source: "curated-calque-pack-v1"
    override_ok: true
  - pattern: "листинга"
    locale: ru
    reason: "loan-calque-listing"
    hint: "объявления"
    severity: likely
    source: "curated-calque-pack-v1"
    override_ok: true
  - pattern: "листинг"
    locale: ru
    reason: "loan-calque-listing"
    hint: "объявление"
    severity: likely
    source: "curated-calque-pack-v1"
    override_ok: true
  - pattern: "оффшорный"
    locale: ru
    reason: "loan-calque-offshore"
    hint: "океанский / для дальних переходов (если не термин класса)"
    severity: weak
    source: "curated-calque-pack-v1"
  - pattern: "оффшорная"
    locale: ru
    reason: "loan-calque-offshore"
    hint: "океанская"
    severity: weak
    source: "curated-calque-pack-v1"
  - pattern: "иншорный"
    locale: ru
    reason: "loan-calque-inshore"
    hint: "прибрежный"
    severity: likely
    source: "curated-calque-pack-v1"
  - pattern: "хендлинг"
    locale: ru
    reason: "loan-calque-handling"
    hint: "управляемость"
    severity: likely
    source: "curated-calque-pack-v1"
  - pattern: "перформанс"
    locale: ru
    reason: "loan-calque-performance"
    hint: "ходкость / характеристики"
    severity: likely
    source: "curated-calque-pack-v1"
  - pattern: "лайаут"
    locale: ru
    reason: "loan-calque-layout"
    hint: "планировка"
    severity: likely
    source: "curated-calque-pack-v1"
  - pattern: "сёрвейор"
    locale: ru
    reason: "loan-calque-surveyor"
    hint: "сюрвейер (принятый термин) vs выдуманная форма"
    severity: weak
    source: "curated-calque-pack-v1"
  - pattern: "сёрвей"
    locale: ru
    reason: "loan-calque-survey"
    hint: "сюрвей (если не в allowlist)"
    severity: weak
    source: "curated-calque-pack-v1"
  - pattern: "байер"
    locale: ru
    reason: "loan-calque-buyer"
    hint: "покупатель"
    severity: likely
    source: "curated-calque-pack-v1"
  - pattern: "селлер"
    locale: ru
    reason: "loan-calque-seller"
    hint: "продавец"
    severity: likely
    source: "curated-calque-pack-v1"
  - pattern: "брокерэдж"
    locale: ru
    reason: "loan-calque-brokerage"
    hint: "брокерская комиссия / брокеридж"
    severity: likely
    source: "curated-calque-pack-v1"
  - pattern: "мейк"
    locale: ru
    reason: "loan-calque-make"
    hint: "марка / производитель"
    severity: likely
    source: "curated-calque-pack-v1"
  - pattern: "моделйир"
    locale: ru
    reason: "invented-calque"
    hint: "модель год"
    severity: confirmed
    source: "synthetic-test"
  - pattern: "драфт"
    locale: ru
    reason: "loan-calque-draft"
    hint: "осадка"
    severity: likely
    source: "curated-calque-pack-v1"
  - pattern: "бим"
    locale: ru
    reason: "loan-calque-beam"
    hint: "ширина"
    severity: weak
    source: "curated-calque-pack-v1"
  - pattern: "хэдрум"
    locale: ru
    reason: "loan-calque-headroom"
    hint: "высота в каюте"
    severity: likely
    source: "curated-calque-pack-v1"
  - pattern: "койл"
    locale: ru
    reason: "loan-calque-coil"
    hint: "бухта / кольцо троса"
    severity: weak
    source: "curated-calque-pack-v1"
  - pattern: "тёрн"
    locale: ru
    reason: "loan-calque-turn"
    hint: "оборот / галс"
    severity: weak
    source: "curated-calque-pack-v1"
  - pattern: "скипперство"
    locale: ru
    reason: "loan-calque-skippering"
    hint: "работа шкипером"
    severity: likely
    source: "curated-calque-pack-v1"
  - pattern: "чартерныйй"
    locale: ru
    reason: "morph-calque-typo"
    hint: "чартерный"
    severity: confirmed
    source: "synthetic-test"
  - pattern: "препуркчес"
    locale: ru
    reason: "loan-calque-prepurchase"
    hint: "предпродажный"
    severity: confirmed
    source: "curated-calque-pack-v1"
  - pattern: "взять в свои руки"
    locale: ru
    match: phrase
    reason: "phrase-calque-own-hands"
    hint: "возглавить / взять управление — check if calque from EN take into own hands"
    severity: confirmed
    source: "phrase-calque-bank"
  - pattern: "в ближайшем будущем"
    locale: ru
    match: phrase
    reason: "phrase-calque-near-future"
    hint: "скоро — канцелярит / calque padding"
    severity: likely
    source: "phrase-calque-bank"
  - pattern: "обратить внимание на то"
    locale: ru
    match: phrase
    reason: "phrase-calque-pay-attention"
    hint: "учтите / заметьте — calque of pay attention to the fact"
    severity: confirmed
    source: "phrase-calque-bank"
  - pattern: "имеет место быть"
    locale: ru
    match: phrase
    reason: "phrase-calque-has-place"
    hint: "есть / происходит — канцелярит"
    severity: likely
    source: "phrase-calque-bank"
  - pattern: "принять решение о"
    locale: ru
    match: phrase
    reason: "phrase-calque-make-decision"
    hint: "решить — calque padding of make a decision about"
    severity: likely
    source: "phrase-calque-bank"

  # --- V3 expansions ---
  - pattern: "делает смысл"
    locale: ru
    match: phrase
    kind: calque
    source_lang: en
    reason: "phrase-calque-delaet-smysl"
    hint: "имеет смысл — калька с EN makes sense"
    severity: confirmed
    source: "v3-phrase-bank"
    positive_examples:
      - "Это объяснение не делает смысл для покупателя."
    negative_examples:
      - "Это объяснение не имеет смысла для покупателя."

  - pattern: "делать смысл"
    locale: ru
    match: phrase
    kind: calque
    source_lang: en
    reason: "phrase-calque-delat-smysl"
    hint: "иметь смысл — калька с EN make sense"
    severity: confirmed
    source: "v3-phrase-bank"
    positive_examples:
      - "Такая правка не будет делать смысл в отчёте."
    negative_examples:
      - "Такая правка не будет иметь смысла в отчёте."

  - pattern: "на базе"
    locale: ru
    match: phrase
    kind: calque
    source_lang: en
    reason: "phrase-calque-na-baze"
    hint: "на основе / исходя из — калька on the basis / на базе"
    severity: weak
    source: "v3-phrase-bank"
    positive_examples:
      - "Цену поставили на базе старых фото из объявления."
    negative_examples:
      - "Цену поставили на основе старых фото из объявления."

  - pattern: "во внимание факт"
    locale: ru
    match: phrase
    kind: calque
    source_lang: en
    reason: "phrase-calque-take-into-attention"
    hint: "учтите / заметьте — калька take into attention/account"
    severity: likely
    source: "v3-phrase-bank"
    positive_examples:
      - "Примите во внимание факт осмоса на корпусе."
    negative_examples:
      - "Учтите осмос на корпусе."

  - pattern: "библиотеке купить"
    locale: ru
    match: phrase
    kind: false_friend
    source_lang: en
    reason: "false-friend-biblioteka-bookstore"
    hint: "в книжном / в магазине — library≠bookstore"
    severity: weak
    source: "v3-false-friends"
    positive_examples:
      - "Я хочу в библиотеке купить справочник по оснастке."
    negative_examples:
      - "Я хочу в книжном купить справочник по оснастке."

  - pattern: "аплай*"
    locale: ru
    match: glob
    kind: calque
    source_lang: en
    reason: "loan-calque-apply"
    hint: "подать заявку / откликнуться"
    severity: likely
    source: "v3-loan-bank"
    positive_examples:
      - "Хочу аплайнуть на вакансию шкипера."
    negative_examples:
      - "Хочу подать заявку на вакансию шкипера."

  - pattern: "сейвить"
    locale: ru
    kind: calque
    source_lang: en
    reason: "loan-calque-save"
    hint: "сохранить"
    severity: likely
    source: "v3-loan-bank"
    positive_examples:
      - "Не забудь сейвить отчёт перед закрытием."
    negative_examples:
      - "Не забудь сохранить отчёт перед закрытием."

  - pattern: "форварднуть"
    locale: ru
    kind: calque
    source_lang: en
    reason: "loan-calque-forward"
    hint: "переслать"
    severity: likely
    source: "v3-loan-bank"
    positive_examples:
      - "Можешь форварднуть письмо сюрвейеру?"
    negative_examples:
      - "Можешь переслать письмо сюрвейеру?"

  - pattern: "ивенчуально"
    locale: ru
    kind: calque
    source_lang: en
    reason: "loan-calque-eventually"
    hint: "в итоге / со временем"
    severity: confirmed
    source: "v3-loan-bank"
    positive_examples:
      - "Ивенчуально мы закончим ремонт к осени."
    negative_examples:
      - "В итоге мы закончим ремонт к осени."

  - pattern: "акчуали"
    locale: ru
    kind: calque
    source_lang: en
    reason: "loan-calque-actually"
    hint: "на самом деле / собственно"
    severity: confirmed
    source: "v3-loan-bank"
    positive_examples:
      - "Акчуали оферта завышена без сюрвея."
    negative_examples:
      - "На самом деле оферта завышена без сюрвея."

  - pattern: "реалайзить"
    locale: ru
    kind: calque
    source_lang: en
    reason: "loan-calque-realize"
    hint: "осознать / понять"
    severity: confirmed
    source: "v3-loan-bank"
    positive_examples:
      - "Я смог реалайзить что на корпусе осмос."
    negative_examples:
      - "Я смог осознать что на корпусе осмос."

  - pattern: "зависит от того насколько"
    locale: ru
    match: phrase
    kind: calque
    source_lang: en
    reason: "phrase-calque-depends-how-much"
    hint: "зависит от того, насколько — проверьте канцелярит"
    severity: weak
    source: "v3-phrase-bank"
    positive_examples:
      - "Цена зависит от того насколько свежий антифоулинг."
    negative_examples:
      - "Цена зависит от свежести антифоулинга."
